[package]
name = "belvedere-core"
description = "Shared types and helpers for Belvedere"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# Exposes the GGUF fixture builder to other crates' tests.
fixtures = []

[dependencies]
chrono = "0.4.45"
futures-channel = { version = "0.3.34", features = ["sink"] }
futures-util = { version = "0.3.34", features = ["sink"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["time", "macros"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3.27.0"
