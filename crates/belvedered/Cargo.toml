[package]
name = "belvedered"
description = "Belvedere background service"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde_json = "1"
anyhow = "1.0.104"
belvedere-core.workspace = true
chrono = "0.4.45"
futures-util = "0.3.34"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "signal", "time"] }
tracing = "0.1.44"
tracing-journald = "0.3.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
zbus = { version = "5.19.0", default-features = false, features = ["tokio"] }
notify = "8"
libc = "0.2.190"

[dev-dependencies]
chrono = "0.4.45"
futures-util = "0.3.34"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "time", "process"] }
