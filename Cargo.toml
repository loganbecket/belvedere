[workspace]
resolver = "2"
members = [
    "crates/belvedere-core",
    "crates/belvedered",
    "crates/belvedere",
    "crates/belvedere-applet",
    "crates/belvedere-model",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
repository = "https://github.com/loganbecket/belvedere"
rust-version = "1.93"

[workspace.dependencies]
belvedere-core = { path = "crates/belvedere-core" }

# llama.cpp is unusable unoptimized (a one-billion-parameter model takes
# minutes per token), so build it optimized even for debug and test builds.
[profile.dev.package.llama-cpp-sys-2]
opt-level = 3
